# codex-desktop 站点配置（桌面端 + 网关共用同一份规则源）。
# 修改网关侧后执行 `codex-desktop-gateway restart` 生效；桌面端下次启动读取。

# 可选访问口令：本机自查用；前置了带认证的反向代理时留空即可。
auth:
  password: ""

# 界面上显示的 Codex / ChatGPT / OpenAI 文案与标识统一换成这个名字。
# 也可以不改这里、只在 /etc/codex-desktop/gateway.env 里设 CODEX_DESKTOP_BRAND_NAME
# （环境变量优先于本文件）；界面语言则用 CODEX_DESKTOP_LOCALE（默认 zh-CN）。
brand:
  name: "wdev"

# 出站域名策略：命中 block 的域名一律本地拦截，不发真实请求，避免信息泄露。
# 模型流量走本机代理，不经过浏览器出站通道，因此不需要（也不应该）写在这里。
network:
  block:
    - "*.chatgpt.com"
    - "chatgpt.com"
    - "*.openai.com"
    - "*.oaiusercontent.com"
    - "*.statsig.com"
    - "statsigapi.net"
  allow: []
# URL 级临时放行：升级后如出现新端点被误伤（表现为载入慢、功能静默失效、界面回退英文），
# 可在此按 <hostPattern>/<pathGlob> 加一条规则做临时放行，命中即放行、优先于 block。
# 规则语义：按第一个 / 切分 host 与 path；无 / 的条目等价于 allow（host 级）；
# path 对 URL 的 pathname 做 glob 匹配（大小写敏感、忽略 query），* 匹配任意长度（含 /）。
# 放行是临时手段：放行后执行 codex-desktop-gateway doctor 复核，确认无异常后尽快收窄或移除。
# 示例：
#   allowPaths:
#     - "ab.chatgpt.com/v1/initialize"   # 精确 path
#     - "chatgpt.com/backend-api/*"      # 前缀通配
  allowPaths: []
